name: Publish Firtool Resolver

on:
  workflow_call:

jobs:
  # This assumes you've already run the tests
  publish:
    name: Publish Firtool Resolver
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Scala and Coursier
        uses: coursier/setup-action@v2
        with:
          jvm: temurin:17
      - name: Import GPG key
        # This is crazy-max/ghaction-import-gpg@v6.3.0, using commit for security reasons
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec
        with:
          gpg_private_key: ${{ secrets.PGP_SECRET }}
          passphrase: ${{ secrets.PGP_PASSPHRASE }}
      - name: Publish
        shell: bash
        run: |
          ./mill -i firtool-resolver[_].publishSonatypeCentral
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

