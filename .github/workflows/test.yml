name: Test

on:
  workflow_call:

jobs:
  ci:
    name: Run Tests
    strategy:
      matrix:
        scala-version: ["2.13", "2.12"]
        runner: ["ubuntu-24.04", "macos-15", "windows-2025"]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Scala and Coursier
        uses: coursier/setup-action@v2
        with:
          jvm: temurin:17
      - name: Run Test
        shell: bash
        env:
          # Also run the tests that need network access (real GitHub releases, Maven Central, real firtool)
          FIRTOOL_RESOLVER_LIVE_TESTS: "1"
        run: |
          # First run of mill is important to set itself up
          ./mill resolve _
          ./mill -i 'firtool-resolver[${{ matrix.scala-version }}].test'

